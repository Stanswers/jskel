# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
set-option -g mode-keys vi
bind-key C-a send-prefix

set -g mouse on

set -g default-terminal "screen-256color"

# ==========================================
# COLOR (Solarized dark)
# ==========================================

# Enable RGB colour if running in xterm(1)
set-option -sa terminal-overrides ",xterm*:Tc"

# default statusbar colors
set-option -g status-style fg=yellow,bg=black #yellow and base02

# default window title colors
set-window-option -g window-status-style fg=brightblue,bg=default #base0 and default
#set-window-option -g window-status-style dim

# active window title colors
set-window-option -g window-status-current-style fg=brightred,bg=default #orange and default
#set-window-option -g window-status-current-style bright

# pane border
set-option -g pane-border-style fg=black #base02
set-option -g pane-active-border-style fg=brightgreen #base01

# message text
set-option -g message-style fg=brightred,bg=black #orange and base01

# pane number display
set-option -g display-panes-active-colour brightred #orange
set-option -g display-panes-colour blue #blue

# clock
set-window-option -g clock-mode-colour green #green

# bell
set-window-option -g window-status-bell-style fg=black,bg=red #base02, red

# ==========================================
# VIM-STYLE COPY MODE & WINDOWS CLIPBOARD
# ==========================================

# 1. Enable native terminal clipboard pass-through
set -g set-clipboard on

# 2. Map 'v' to start regular character-wise selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

# 3. Map 'V' (Shift+v) to start full line-wise selection
bind-key -T copy-mode-vi V send-keys -X select-line

# 4. Map 'C-v' (Ctrl+v) to start a visual block/rectangle selection directly
bind-key -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle

# 5. Tell tmux to use OSC 52 to send text down the pipeline on 'y' or mouse-up
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux save-buffer -"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "tmux save-buffer -"

# ==========================================
# VIM-STYLE Pane selection
# ==========================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
